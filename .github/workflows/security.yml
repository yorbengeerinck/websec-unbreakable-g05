
name: security-pipeline

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  sca-dotnet:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.3.0
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          dotnet-version: '10.0.x'

      - name: SCA strict - fail on any vulnerable package
        run: |
          dotnet restore ./app/Unbreakable.csproj
          dotnet list ./app/Unbreakable.csproj package --vulnerable --include-transitive 2>&1 | tee sca.txt
          cat sca.txt
          if grep -q "has the following vulnerable packages" sca.txt; then
            echo "Kwetsbare packages gevonden. De Newtonsoft.Json-baseline is opgeruimd, dus er is geen exceptie meer."
            exit 1
          fi
          echo "Geen vulnerable packages -> OK"

  sast-semgrep:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.3.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          # Gepind: voor 3.15 bestaat er nog geen semgrep-wheel.
          python-version: '3.13'

      - name: Install Semgrep
        # Gepind op 1.182.1. Semgrep 1.185.0 crasht op de auto-ruleset met
        # "semgrep-core exited with -11" (segfault), nog voor het scannen begint.
        # Zonder pin verandert de scanner ongemerkt van versie en wordt de
        # uitslag van deze job niet reproduceerbaar.
        run: python -m pip install semgrep==1.182.1

      - name: Semgrep SAST
        run: |
          semgrep scan --config auto --json --output semgrep-results.json --strict

      - name: Check new critical findings
        run: python scripts/check-semgrep.py

      - name: Upload Semgrep results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: semgrep-results
          path: semgrep-results.json
          if-no-files-found: ignore

  secret-gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.3.0
        with:
          fetch-depth: 0

      - name: Gitleaks strict
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_CONFIG: .gitleaks.toml

  backend-tests:
    # Y7/Y8: integratietests op API-niveau (JWT met een eigen testsleutel, stand-in voor OpenFGA)
    # tegen een echte Postgres. Echte OpenFGA-tests volgen apart.
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: ci-test-only
          POSTGRES_DB: unbreakable_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.3.0
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          dotnet-version: '10.0.x'

      - name: Backend tests
        env:
          TEST_CONNECTIONSTRING: Host=localhost;Port=5432;Database=unbreakable_test;Username=postgres;Password=ci-test-only
        run: dotnet test ./tests/Unbreakable.Tests/Unbreakable.Tests.csproj --configuration Release

  openfga-model:
    # Y8: het autorisatiemodel (plan 4.4) moet geldig zijn; de modeltests van Pros (model.fga.yaml)
    # draaien automatisch zodra dat bestand bestaat.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.3.0

      - name: Model valideren
        run: |
          docker run --rm -v "$PWD/deploy/openfga:/m:ro" openfga/cli@sha256:31a565d14d1c5ca8170d3a2225eb66517d9f490539967bcb3421613c5e2538a4 \
            model validate --file /m/model.fga

      - name: Modeltests (indien model.fga.yaml aanwezig)
        run: |
          if [ -f deploy/openfga/model.fga.yaml ]; then
            docker run --rm -v "$PWD/deploy/openfga:/m:ro" openfga/cli@sha256:31a565d14d1c5ca8170d3a2225eb66517d9f490539967bcb3421613c5e2538a4 \
              model test --tests /m/model.fga.yaml
          else
            echo "deploy/openfga/model.fga.yaml ontbreekt nog (P2, Pros): enkel validatie uitgevoerd."
          fi

  compose-validate:
    # Y8: de compose-file moet geldig zijn en de app-image moet bouwen vóór er gedeployed wordt.
    # Dummy-waarden, enkel voor de validatie; echte geheimen staan alleen in /etc/unbreakable/.env.
    runs-on: ubuntu-latest
    env:
      APP_DOMAIN: ci.example.test
      DB_PASSWORD: ci-only
      KC_DB_PASSWORD: ci-only
      OPENFGA_DB_PASSWORD: ci-only
      OPENFGA_API_TOKEN: ci-only
      BW_DB_PASSWORD: ci-only
      BW_UI_ADMIN_PASSWORD: ci-only
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.3.0

      - name: docker compose config
        run: docker compose config --quiet

      - name: App-image bouwen
        run: docker compose build app

  deploy:
    needs: [sca-dotnet, sast-semgrep, secret-gitleaks, backend-tests, openfga-model, compose-validate]
    # Twee deploys tegelijk zouden elkaars compose-run overlappen: wachten, niet annuleren.
    concurrency:
      group: deploy-g05
      cancel-in-progress: false
    if: github.repository == 'yorbengeerinck/websec-unbreakable-g05' && github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: [self-hosted, linux, g05]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.3.0

      - name: Deploy app
        run: docker compose --env-file /etc/unbreakable/.env up -d --build

      - name: Health check via WAF (HTTPS, met retries)
        run: |
          for i in $(seq 1 12); do
            code=$(curl -s -o /dev/null -w '%{http_code}' https://g05.ipv6.thelastgym.be/health || true)
            [ "$code" = "200" ] && echo "health OK" && exit 0
            echo "poging $i: HTTP $code"; sleep 5
          done
          docker compose --env-file /etc/unbreakable/.env logs --tail 50 bunkerweb
          exit 1

      - name: Smoke-test via WAF en poortcontrole
        run: |
          base=https://g05.ipv6.thelastgym.be
          fail=0
          check() {
            code=$(curl -s -o /dev/null -w '%{http_code}' "$3" || true)
            if [ "$code" = "$2" ]; then echo "OK   $1 ($code)"; else echo "FAIL $1: verwacht $2, kreeg $code"; fail=1; fi
          }
          check "health" 200 "$base/health"
          check "api zonder token/identiteit" 401 "$base/api/messages"
          check "keycloak discovery (master) bereikbaar" 200 "$base/auth/realms/master/.well-known/openid-configuration"
          check "keycloak admin publiek geblokkeerd" 403 "$base/auth/admin/"
          ports=$(docker compose --env-file /etc/unbreakable/.env ps --format '{{.Ports}}' \
            | grep -oE '(0\.0\.0\.0|\[::\]):[0-9]+' | sed -E 's/.*://' | sort -u | tr '\n' ' ')
          echo "publiek gepubliceerde poorten: $ports"
          for p in $ports; do
            case "$p" in 80|443) ;; *) echo "FAIL poort $p is publiek gepubliceerd"; fail=1;; esac
          done
          exit $fail
