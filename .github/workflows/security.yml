name: security-pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  # DSOMM: Patch Management | Dependency vulnerability scanning (SCA)
  sca-dotnet:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: dotnet restore + vulnerable check (SCA audit)
        run: |
          dotnet restore ./app/Unbreakable.csproj
          dotnet list ./app/Unbreakable.csproj package --vulnerable --include-transitive || true
          echo "AUDIT-MODE: faalt nu niet, baseline in docs/accepted-findings.md"

  # DSOMM: Secure Build | Static Application Security Testing (SAST)
  sast-semgrep:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Semgrep SAST
        uses: returntocorp/semgrep-action@v1
        with:
          config: auto
        continue-on-error: true

  # DSOMM: Secrets Management | Secret scanning
  secret-gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Gitleaks scan
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        continue-on-error: true
