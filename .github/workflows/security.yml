name: security-pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  # DSOMM: Patch Management | Dependency vulnerability scanning (SCA)
  sca-dotnet:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: SCA strict - fail on new HIGH/CRITICAL
        run: |
          dotnet restore ./app/Unbreakable.csproj
          dotnet list ./app/Unbreakable.csproj package --vulnerable --include-transitive 2>&1 | tee sca.txt
          cat sca.txt
          # baseline: alleen Newtonsoft.Json 12.0.1 mag
          if grep -q "has the following vulnerable packages" sca.txt; then
            # haal alle vulnerable regels eruit behalve baseline
            NEW=$(grep -E "High|Critical|Severe" sca.txt | grep -v "Newtonsoft.Json" || true)
            if [ -n "$NEW" ]; then
              echo "NIEUWE KRITIEKE VULN: $NEW"
              exit 1
            else
              echo "Alleen baseline Newtonsoft.Json 12.0.1 gevonden -> OK, geaccepteerd"
            fi
          else
            echo "Geen vulnerable packages -> OK"
          fi

  # DSOMM: Secure Build | SAST
  sast-semgrep:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Semgrep SAST
        uses: returntocorp/semgrep-action@v1
        with:
          config: auto
        continue-on-error: true

  # DSOMM: Secrets Management | Secret scanning
  secret-gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Gitleaks strict
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_CONFIG: .gitleaks.toml
          # GEEN continue-on-error meer -> nieuwe secret = FAIL
