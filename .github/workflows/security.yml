
name: security-pipeline

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main]

jobs:
  # DSOMM: Patch Management | Dependency vulnerability scanning (SCA)
  sca-dotnet:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: SCA strict - fail on new HIGH/CRITICAL
        run: |
          dotnet restore ./app/Unbreakable.csproj
          dotnet list ./app/Unbreakable.csproj package --vulnerable --include-transitive 2>&1 | tee sca.txt
          cat sca.txt
          if grep -q "has the following vulnerable packages" sca.txt; then
            NEW=$(grep -E "High|Critical|Severe" sca.txt | grep -v "Newtonsoft.Json" || true)
            if [ -n "$NEW" ]; then
              echo "NIEUWE KRITIEKE VULN: $NEW"
              exit 1
            else
              echo "Alleen baseline Newtonsoft.Json 12.0.1 -> OK"
            fi
          else
            echo "Geen vulnerable packages -> OK"
          fi

  # DSOMM: Secure Build | SAST
  sast-semgrep:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install Semgrep
        run: python -m pip install semgrep

      - name: Semgrep SAST
        run: |
          semgrep scan --config auto --json --output semgrep-results.json --strict

      - name: Check new critical findings
        run: |
          python - <<'PY'
          import json
          import sys

          with open("semgrep-results.json", encoding="utf-8") as f:
              data = json.load(f)

          with open(".semgrep-baseline.json", encoding="utf-8") as f:
              baseline = json.load(f)

          accepted = set(baseline["accepted_fingerprints"])
          findings = data.get("results", [])

          new_critical = []

          for finding in findings:
              severity = finding.get("extra", {}).get("severity", "").upper()
              fingerprint = finding.get("extra", {}).get("fingerprint")

              if severity == "CRITICAL" and fingerprint not in accepted:
                  new_critical.append(finding)

          print(f"Semgrep: {len(findings)} bevindingen.")
          print(f"Nieuwe kritieke bevindingen: {len(new_critical)}")

          for finding in new_critical:
              print(
                  f"CRITICAL: {finding['check_id']} "
                  f"in {finding['path']}:{finding['start']['line']}"
              )

          if new_critical:
              sys.exit(1)

          print("Geen nieuwe kritieke bevindingen.")
          PY

      - name: Upload Semgrep results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: semgrep-results
          path: semgrep-results.json
          if-no-files-found: ignore

  # DSOMM: Secrets Management | Secret scanning
  secret-gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Gitleaks strict
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_CONFIG: .gitleaks.toml

  # Deploy: alleen eigen repo, alleen push naar main, nooit forks/PRs
  deploy:
    needs: [sca-dotnet, sast-semgrep, secret-gitleaks]
    if: github.repository == 'yorbengeerinck/websec-unbreakable-g05' && github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: [self-hosted, linux, g05]
    steps:
      - uses: actions/checkout@v4

      - name: Deploy app
        run: |
          docker compose up -d --build
          sleep 10
          docker ps
          curl -f http://localhost:8080/health
