title = "g05 gitleaks"

[extend]
useDefault = true

# Geen pad-allowlist meer: een geheim in appsettings.json of docker-compose.yml
# laat de pipeline nu wél falen.
#
# Enkel deze twee historische lab-waarden blijven toegestaan, omdat ze in de
# git-historiek staan (opdracht 2/3). Beide zijn inmiddels geroteerd/verwijderd
# en komen niet meer in de working tree voor. Elke andere waarde faalt.
[allowlist]
description = "Historische lab-waarden uit opdracht 2/3, reeds geroteerd. Nieuwe geheimen falen."
regexes = [
  '''ubk_live_7Hq2Lx9Vt4Rm8Pz3Wc6Ny1Bf5Kd0Js''',
  '''Unbr3akable!2026''',
]
