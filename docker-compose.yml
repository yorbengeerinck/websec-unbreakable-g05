
services:
  app:
    build: ./app
    expose:
      - "8080"
    environment:
      ConnectionStrings__Unbreakable: "Host=db;Port=5432;Database=unbreakable;Username=unbreakable;Password=Unbr3akable!2026"
    depends_on:
      - db
    restart: unless-stopped
    networks:
      - backend
      - bw-services

  db:
    image: postgres:17
    environment:
      POSTGRES_DB: unbreakable
      POSTGRES_USER: unbreakable
      POSTGRES_PASSWORD: Unbr3akable!2026
    volumes:
      - dbdata:/var/lib/postgresql/data
    restart: unless-stopped
    networks:
      - backend

  bunkerweb:
    image: bunkerity/bunkerweb:1.6.15
    ports:
      - "80:8080/tcp"
      - "443:8443/tcp"
    environment:
      API_WHITELIST_IP: "127.0.0.0/8 10.20.30.0/24"
    restart: unless-stopped
    networks:
      - bw-universe
      - bw-services

  bw-scheduler:
    image: bunkerity/bunkerweb-scheduler:1.6.15
    depends_on:
      - bunkerweb
    environment:
      BUNKERWEB_INSTANCES: "bunkerweb"
      API_WHITELIST_IP: "127.0.0.0/8 10.20.30.0/24"
      SERVER_NAME: "${APP_DOMAIN}"
      AUTO_LETS_ENCRYPT: "yes"
      DISABLE_DEFAULT_SERVER: "yes"
      SERVE_FILES: "no"
      USE_REVERSE_PROXY: "yes"
      REVERSE_PROXY_URL: "/"
      REVERSE_PROXY_HOST: "http://app:8080"
    volumes:
      - bw-storage:/data
    restart: unless-stopped
    networks:
      - bw-universe

volumes:
  dbdata:
  bw-storage:

networks:
  backend:
    internal: true
  bw-services:
  bw-universe:
    ipam:
      config:
        - subnet: 10.20.30.0/24
